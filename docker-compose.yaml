services:
  postgres:
    image: postgres:18
    container_name: pdns-postgres
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - ./postgres:/var/lib/postgresql
      
  pdns:
    build: .
    container_name: pdns
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "127.0.0.1:8081:8081"

    volumes:
      - ./pdns.conf.template:/etc/powerdns/pdns.conf.template:ro
      - ./pdns-data:/var/lib/powerdns

  powerdns-admin:
    image: ngoduykhanh/powerdns-admin:latest
    container_name: powerdns-admin
    restart: unless-stopped

    env_file:
      - .env
    
    volumes:
      - ./pda-data:/data
    ports:
      - "9191:80"
    depends_on:
      - pdns
      
