services:
  pdns:
    build: .
    container_name: pdns
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8081:8081"

    volumes:
      - ./pdns.conf.template:/etc/powerdns/pdns.conf.template:ro
      - ./bind.conf:/etc/powerdns/bind.conf:ro
      - ./zones:/zones:ro
      
